[project]
name = "supply-chain-anomaly-detection"
version = "0.1.0"
description = "Real-time supply chain anomaly detection with Kafka, PyTorch and Dash"
requires-python = ">=3.11"
readme = "README.md"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "D"]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
    "D105",  # docstrings on magic methods
    "D107",  # docstrings on __init__
    "D413",  # blank line after last docstring section
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"notebooks/**" = ["D", "E402"]
# `X` / `X_train` are the scikit-learn convention for feature matrices.
"src/models/isolation_forest_detector.py" = ["N803"]
"tests/unit/test_isolation_forest_detector.py" = ["D", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs external services such as Kafka (deselect with -m 'not integration')",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
files = ["src"]
