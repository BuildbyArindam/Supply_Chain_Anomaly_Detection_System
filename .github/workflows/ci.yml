name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # nightly: also runs the load test

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  # CPU-only PyTorch: the default Linux wheel bundles CUDA (~2.5 GB) and is not needed here.
  TORCH_INDEX: https://download.pytorch.org/whl/cpu

jobs:
  lint:
    name: Lint (black + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install linters (versions pinned in requirements.txt)
        run: |
          pip install "$(grep -E '^black==' requirements.txt)" "$(grep -E '^ruff==' requirements.txt)"
      - run: black --check src tests
      - run: ruff check src tests

  unit-tests:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "torch==$(grep -E '^torch==' requirements.txt | cut -d= -f3)" --index-url "$TORCH_INDEX"
          pip install -r requirements.txt
      - name: Run unit tests with coverage
        # Docker-free: the Kafka integration tests run in their own job below. The load test and
        # the browser smoke test are excluded here as well.
        run: |
          pytest tests -n auto --timeout=600 \
            -m "not integration and not performance and not browser" \
            --cov=src --cov-report=term-missing:skip-covered \
            --cov-report=xml --cov-report=html --cov-fail-under=85 \
            --junitxml=reports/junit-unit.xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Keep the test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            reports/junit-unit.xml
            htmlcov/
            coverage.xml

  integration-tests:
    name: Integration tests (real Kafka via testcontainers)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "torch==$(grep -E '^torch==' requirements.txt | cut -d= -f3)" --index-url "$TORCH_INDEX"
          pip install -r requirements.txt
      - name: Pull the Kafka image once so the tests do not time out on it
        run: docker pull confluentinc/cp-kafka:7.6.0
      - name: Run integration tests
        run: |
          pytest tests/integration -m "integration and not browser" --timeout=600 \
            --junitxml=reports/junit-integration.xml
      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: reports/junit-integration.xml

  load-test:
    name: Load test (SLO assertions)
    # Needs a quiet machine and 3 minutes: nightly and on demand, not on every pull request.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "torch==$(grep -E '^torch==' requirements.txt | cut -d= -f3)" --index-url "$TORCH_INDEX"
          pip install -r requirements.txt
      - name: Run the Locust load test (0 to 100 users in 60 s, 100 users for 120 s)
        run: python tests/load/run_load_test.py
      - name: Keep the SLO summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-summary
          path: reports/load_test_summary.json
